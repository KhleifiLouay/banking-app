<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SecureBank</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Connexion</h1>
                <p>Accédez à votre espace client</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Se Connecter</button>
            </form>
            
            <div class="auth-footer">
                <p>Pas de compte ? <a href="signup.html">S'inscrire</a></p>
                <p><a href="index.html">← Retour à l'accueil</a></p>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <!-- API Configuration -->
    <script>
        // For local development: 'http://localhost:5000/api'
        // For production: 'https://banking-app-rg9t.onrender.com/api'
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000/api'
            : 'https://banking-app-rg9t.onrender.com/api';
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
